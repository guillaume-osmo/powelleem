[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "powelleem"
version = "0.2.0"
description = "Electronegativity Equalization Method (EEM) parameter fitting — modern Python port of Godin's MATLAB DE+NEWUOA pipeline, with analytical Jacobian + multiple solvers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Guillaume Godin" },
]
keywords = [
    "EEM", "electronegativity equalization", "partial charges",
    "NEWUOA", "BOBYQA", "Powell", "derivative-free optimization",
    "Levenberg-Marquardt", "molecular descriptors", "RDKit", "MMFF94",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
jax = ["jax>=0.4.30", "jaxlib>=0.4.30"]
torch = ["torch>=2.5"]
powell = ["pdfo>=2.0"]
rdkit = ["rdkit>=2024.03.1"]
chaos = ["rdkit>=2024.03.1"]
viz = ["matplotlib>=3.8", "seaborn>=0.13"]
all = [
    "jax>=0.4.30", "jaxlib>=0.4.30",
    "pdfo>=2.0",
    "rdkit>=2024.03.1",
    "matplotlib>=3.8", "seaborn>=0.13",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/guillaume-godin/powelleem"
Documentation = "https://guillaume-godin.github.io/powelleem"
Repository = "https://github.com/guillaume-godin/powelleem"
Issues = "https://github.com/guillaume-godin/powelleem/issues"
Changelog = "https://github.com/guillaume-godin/powelleem/blob/main/CHANGELOG.md"

[project.scripts]
powelleem = "powelleem.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/powelleem"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "LICENSE", "CITATION.cff", "CHANGELOG.md"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # let formatter handle line length

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=powelleem --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "jax: tests requiring JAX",
    "powell: tests requiring PRIMA (NEWUOA/BOBYQA)",
]

[tool.coverage.run]
source = ["src/powelleem"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
